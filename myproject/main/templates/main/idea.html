{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Story — Story Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/idea.css' %}">
</head>
<body class="bg-light">

    <nav class="story-nav" aria-label="Story builder steps">
        <div class="nav-container">
            <a href="{% url 'idea' %}" class="nav-btn nav-start">
                <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
                Start Over
            </a>
            <a href="{% url 'video' %}" class="nav-btn nav-storyboard">
                <i class="bi bi-film" aria-hidden="true"></i>
                Storyboard
            </a>
        </div>
    </nav>

    <!-- Loading overlay -->
    <div id="loadingOverlay"
         role="status"
         aria-live="assertive"
         aria-label="Generating your story, please wait"
         aria-hidden="true"
         style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999;">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;">
            <div class="rocket-orbit" aria-hidden="true">
                <i class="bi bi-rocket-takeoff rocket-icon"></i>
            </div>
            <p class="text-white mt-5" style="font-size:1.5rem;">Generating your story...</p>
        </div>
    </div>

    <form method="post" action="{% url 'idea' %}" id="storyForm">
        {% csrf_token %}
        <input type="hidden" name="moments" value="">

        <div id="ideaCarousel"
             class="carousel slide"
             data-bs-ride="false"
             aria-roledescription="carousel"
             aria-label="Story setup steps">
            <div class="carousel-inner">

                <!-- Slide 1 -->
                <div class="carousel-item active"
                     role="group"
                     aria-roledescription="slide"
                     aria-label="Step 1 of 2">
                    <div class="idea-slide">
                        <div class="card shadow-sm p-4">
                            <p class="step-label" aria-hidden="true">1 of 2 &nbsp;·&nbsp; Required</p>
                            <h1 class="slide-question">What is the story about?</h1>
                            <label for="conflictInput" class="visually-hidden">What is the story about?</label>
                            <textarea
                                class="form-control idea-textarea"
                                name="conflict"
                                id="conflictInput"
                                rows="6"
                                placeholder="Enter as much or as little as you'd like."
                                aria-required="true"
                                aria-describedby="conflictError"
                            ></textarea>
                            <p id="conflictError" class="visually-hidden" role="alert" aria-live="assertive"></p>
                        </div>
                    </div>
                </div>

                <!-- Slide 2 -->
                <div class="carousel-item"
                     role="group"
                     aria-roledescription="slide"
                     aria-label="Step 2 of 2">
                    <div class="idea-slide">
                        <div class="card shadow-sm p-4">
                            <p class="step-label" aria-hidden="true">2 of 2 &nbsp;·&nbsp; Optional</p>
                            <h1 class="slide-question">How does it end?</h1>
                            <label for="resolutionInput" class="visually-hidden">How does the story end?</label>
                            <textarea
                                class="form-control idea-textarea"
                                name="resolution"
                                id="resolutionInput"
                                rows="6"
                                placeholder="Enter as much or as little as you'd like."
                            ></textarea>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </form>

    <!-- Fixed bottom nav -->
    <nav class="idea-nav-bar" aria-label="Slide navigation">
        <button type="button" id="btnBack" class="idea-nav-btn" disabled aria-disabled="true">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Back
        </button>
        <div class="step-dots" role="tablist" aria-label="Steps">
            <div class="step-dot active" id="dot0" role="tab" aria-label="Step 1" aria-selected="true"></div>
            <div class="step-dot"        id="dot1" role="tab" aria-label="Step 2" aria-selected="false"></div>
        </div>
        <button type="button" id="btnNext" class="idea-nav-btn primary">
            Next <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        'use strict';

        var carouselEl = document.getElementById('ideaCarousel');
        var carousel   = bootstrap.Carousel.getOrCreateInstance(carouselEl, { interval: false, ride: false });
        var current    = 0;
        var total      = 2;

        var btnBack      = document.getElementById('btnBack');
        var btnNext      = document.getElementById('btnNext');
        var conflictEl   = document.getElementById('conflictInput');
        var conflictErr  = document.getElementById('conflictError');

        function updateUI() {
            /* Back button */
            btnBack.disabled = current === 0;
            btnBack.setAttribute('aria-disabled', current === 0 ? 'true' : 'false');

            /* Next / Submit button */
            while (btnNext.firstChild) btnNext.removeChild(btnNext.firstChild);

            if (current === total - 1) {
                /* Last slide — rocket submit */
                btnNext.className = 'idea-nav-btn submit';
                var icon = document.createElement('i');
                icon.className = 'bi bi-rocket-takeoff icon-button';
                icon.setAttribute('aria-hidden', 'true');
                btnNext.appendChild(icon);
                btnNext.setAttribute('aria-label', 'Generate story');
            } else {
                btnNext.className = 'idea-nav-btn primary';
                var label = document.createTextNode('Next ');
                var icon  = document.createElement('i');
                icon.className = 'bi bi-arrow-right';
                icon.setAttribute('aria-hidden', 'true');
                btnNext.appendChild(label);
                btnNext.appendChild(icon);
                btnNext.removeAttribute('aria-label');
            }

            /* Step dots */
            for (var i = 0; i < total; i++) {
                var dot = document.getElementById('dot' + i);
                dot.classList.toggle('active', i === current);
                dot.setAttribute('aria-selected', i === current ? 'true' : 'false');
            }
        }

        function showConflictError(msg) {
            conflictEl.classList.add('is-invalid');
            conflictErr.textContent = msg;
            conflictEl.setAttribute('aria-invalid', 'true');
            conflictEl.focus();
        }

        function clearConflictError() {
            conflictEl.classList.remove('is-invalid');
            conflictErr.textContent = '';
            conflictEl.setAttribute('aria-invalid', 'false');
        }

        btnBack.addEventListener('click', function () {
            if (current > 0) {
                current--;
                carousel.to(current);
                updateUI();
            }
        });

        btnNext.addEventListener('click', function () {
            if (current < total - 1) {
                /* Validate before advancing */
                if (current === 0 && !conflictEl.value.trim()) {
                    showConflictError('Please describe what your story is about before continuing.');
                    return;
                }
                clearConflictError();
                current++;
                carousel.to(current);
                updateUI();
            } else {
                /* Submit */
                if (!conflictEl.value.trim()) {
                    current = 0;
                    carousel.to(0);
                    updateUI();
                    showConflictError('Please describe what your story is about before generating.');
                    return;
                }
                /* Clear all chat histories before generating a new story */
                sessionStorage.removeItem('draft_chat_history');
                sessionStorage.removeItem('persona_chat_histories');
                sessionStorage.removeItem('location_chat_histories');
                sessionStorage.removeItem('scene_chat_histories');

                var overlay = document.getElementById('loadingOverlay');
                overlay.style.display = 'block';
                overlay.setAttribute('aria-hidden', 'false');
                document.getElementById('storyForm').submit();
            }
        });

        conflictEl.addEventListener('input', clearConflictError);

    })();
    </script>
</body>
</html>
